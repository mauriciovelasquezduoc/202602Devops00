# values.yaml - Configuración centralizada del clúster
# Modifica estos valores para cambiar la configuración del despliegue

# Namespace
NAMESPACE=ep02

# Imágenes ECR — la cuenta se resuelve en runtime desde AWS STS (apply-all.sh),
# por lo que aquí se deja el placeholder <AWSAccountId>.
DATABASE_IMAGE=<AWSAccountId>.dkr.ecr.us-east-1.amazonaws.com/ep02-database:latest
BACKEND_IMAGE=<AWSAccountId>.dkr.ecr.us-east-1.amazonaws.com/ep02-backend:latest
FRONTEND_IMAGE=<AWSAccountId>.dkr.ecr.us-east-1.amazonaws.com/ep02-frontend:latest

# Base de datos
DATABASE_NAME=ep02
DATABASE_USER=ep02_user
DATABASE_PASSWORD_B64=YWx1bW5vc19wYXNz
DATABASE_PORT=5432
DATABASE_REPLICAS=1

# Backend
BACKEND_PORT=8080
